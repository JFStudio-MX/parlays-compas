<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Parlays</title>
<style>
:root{
  --bg:#0b0d12;--s1:#131720;--s2:#1a1f2b;--s3:#222838;--bd:#272e40;
  --tx:#e9ecf3;--mu:#8a93a8;--mu2:#5f6880;
  --ok:#2fd27a;--okb:rgba(47,210,122,.14);--no:#ff5c6c;--nob:rgba(255,92,108,.12);
  --gold:#ffc94d;--goldb:rgba(255,201,77,.12);--ac:#6f9bff;--acb:rgba(111,155,255,.13);
  --nba:#ff8a3d;--nfl:#7aa2ff;--nhl:#8fd8ff;--futbol:#3ddc84;--ncaab:#ffb070;--ncaaf:#b9a2ff;--ufc:#ff7a7a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Geist,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button,.chip,.tab,.add,.btn{transition:transform .15s ease,background-color .2s ease,border-color .2s ease,opacity .2s ease}
button:active,.btn:active,.chip:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.prob,.momio,.big,.kpi b,.lgi .mo,.sq{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:20;background:rgba(11,13,18,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.hwrap{max-width:1320px;margin:0 auto;padding:14px 20px 10px}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
.fecha{color:var(--mu);font-size:13px}
.acciones{margin-left:auto;display:flex;gap:8px;align-self:center}
.hoybtn{background:var(--gold);color:#1d1500;border:0;border-radius:10px;padding:7px 14px;font-weight:700;cursor:pointer}
.hoybtn:hover{filter:brightness(1.08)}
.hoybtn small{font-weight:600;opacity:.75;margin-left:4px}
.hoybtn:disabled{opacity:.45;cursor:default;filter:none}
.actbtn{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:7px 12px;font-weight:600;cursor:pointer}
.actbtn:disabled{opacity:.6;cursor:wait}
#act{display:inline-flex;align-items:center;gap:6px}
.filtros{display:flex;gap:10px 16px;flex-wrap:wrap;margin-top:12px;align-items:stretch}
.chip{border:1px solid var(--bd);background:var(--s1);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px;color:var(--mu)}
.chip.on{background:var(--tx);color:#0b0d12;border-color:var(--tx);font-weight:600}
/* deportes: fichas con ícono (color de cada deporte) */
.frow{display:flex;gap:6px;flex-wrap:wrap}
.frow.dias{padding-left:16px;border-left:1px solid var(--bd)}
.dp,.dia{position:relative;display:grid;justify-items:center;align-content:center;border:1px solid var(--bd);background:var(--s1);border-radius:13px;cursor:pointer;color:var(--mu);font-variant-numeric:tabular-nums}
.dp{--c:var(--gold);min-width:64px;padding:8px 10px 7px;gap:4px}
.dp .ic{width:21px;height:21px;color:var(--c);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.dp .nm{font-size:11.5px;font-weight:600;line-height:1}
.dp .ncaa{display:none;font:800 8.5px/1 Geist,sans-serif;letter-spacing:.09em;color:var(--c);opacity:.9;margin-top:-1px}
.dp .n,.dia .n{position:absolute;top:3px;right:5px;font-size:9.5px;font-weight:700;line-height:1;color:var(--mu2)}
.dp:hover,.dia:hover{border-color:#3a4358;color:var(--tx)}
.dp.on{color:var(--tx);border-color:color-mix(in srgb,var(--c) 65%,transparent);background:linear-gradient(165deg,color-mix(in srgb,var(--c) 30%,var(--s1)),color-mix(in srgb,var(--c) 7%,var(--s1)));box-shadow:0 8px 20px -8px color-mix(in srgb,var(--c) 70%,transparent),inset 0 1px 0 rgba(255,255,255,.09)}
.dp.on .ic{transform:scale(1.12)}
.dp.on .n{color:var(--c)}
.dp.vacio{opacity:.38}
/* días: tipo calendario */
.dia{min-width:50px;padding:6px 8px 7px;gap:2px}
.dia .dd{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;line-height:1}
.dia .dn{font:700 20px/1 'Barlow Condensed',sans-serif;color:var(--tx)}
.dia .ic{width:19px;height:19px}
.dia.hoy:not(.on) .dd{color:var(--gold)}
.dia.on{background:linear-gradient(160deg,#ffe08a,#ffc94d 60%,#f5b532);border-color:transparent;color:#5a4400;box-shadow:0 8px 22px -8px rgba(255,201,77,.65),inset 0 1px 0 rgba(255,255,255,.35)}
.dia.on .dn{color:#1d1500}
.dia.on .n{color:#7a5d00}
/* casa: botón con ícono que despliega la lista */
.top{position:relative}
.casawrap{position:relative;display:flex}
.casabtn{display:inline-flex;align-items:center;gap:6px;color:var(--gold);background:var(--goldb);border-color:rgba(255,201,77,.35)}
.casabtn .car{width:14px;height:14px;opacity:.75;transition:transform .2s}
.casabtn.on .car{transform:rotate(180deg)}
.actbtn.casabtn.on{background:rgba(255,201,77,.2);border-color:rgba(255,201,77,.6);color:var(--gold)}
.casapop{display:none;position:absolute;right:0;top:calc(100% + 8px);z-index:25;width:330px;background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:6px;box-shadow:0 22px 60px rgba(0,0,0,.65)}
.casapop.on{display:grid;gap:2px;animation:caer .18s ease}
@keyframes caer{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.casapop .tt{font-size:10.5px;color:var(--mu2);padding:7px 10px 5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.casapop button{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px;background:none;border:0;padding:9px 10px;border-radius:11px;text-align:left;cursor:pointer}
.casapop button b{font-weight:650}
.casapop button small{grid-column:1;color:var(--mu);font-size:11.5px}
.casapop button .ic{grid-column:2;grid-row:1/3;color:var(--gold)}
.casapop button:hover{background:var(--s2)}
.casapop button.on{background:var(--goldb)}
.casapop button.on b{color:var(--gold)}
.tabsrow{display:flex;align-items:flex-end;gap:8px;margin-top:10px}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--mu);font-weight:600;white-space:nowrap}
.tab.on{color:var(--tx);border-color:var(--tx)}
.tab .n{font-weight:500;color:var(--mu2);margin-left:4px}
.filbtn{flex:none;background:var(--s2);border:1px solid var(--bd);border-radius:9px;padding:6px 12px;cursor:pointer;font-weight:600;margin-bottom:4px}
.filbtn.on{background:var(--ac);border-color:var(--ac);color:#06122e}
.layout{max-width:1320px;margin:0 auto;padding:18px 20px 120px;display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:22px;align-items:start}
.intro{color:var(--mu);font-size:13px;margin:0 0 14px;max-width:780px}
.intro b{color:var(--tx)}
h2.sec{font-size:16px;margin:26px 0 10px}
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:13px 14px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.joya{border-color:rgba(255,201,77,.35);background:linear-gradient(180deg,rgba(255,201,77,.06),transparent 60%),var(--s1)}
.card.combo{border-color:rgba(111,155,255,.35);background:linear-gradient(180deg,rgba(111,155,255,.07),transparent 60%),var(--s1)}
.meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mu);min-width:0}
.dep{font-weight:700;font-size:11px;letter-spacing:.04em;padding:2px 7px;border-radius:6px;background:var(--s3);white-space:nowrap}
.dep.nba{color:var(--nba)}.dep.nfl{color:var(--nfl)}.dep.nhl{color:var(--nhl)}.dep.futbol{color:var(--futbol)}.dep.ncaab{color:var(--ncaab)}.dep.ncaaf{color:var(--ncaaf)}.dep.ufc{color:#ff7a7a}
.meta .jg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.add{margin-left:auto;flex:none;width:30px;height:30px;border-radius:9px;border:1px solid var(--bd);background:var(--s2);cursor:pointer;font-size:18px;line-height:1;color:var(--tx)}
.add:hover{background:var(--s3)}
.add.in{background:var(--ok);border-color:var(--ok);color:#06210f;font-size:15px}
.txt{font-size:16px;font-weight:650;line-height:1.25}
.sub{font-size:12px;color:var(--mu);margin-top:2px}
.srow{display:flex;align-items:center;gap:6px;min-width:0}
.slab{font-size:10.5px;color:var(--mu);display:inline-flex;align-items:center;gap:3px;width:52px;flex:none;white-space:nowrap;overflow:hidden}
.slab .lg{width:14px;height:14px}
.sqs{display:flex;gap:3px;flex-wrap:nowrap;overflow:hidden}
.sq{min-width:24px;height:22px;padding:0 4px;border-radius:5px;display:grid;place-items:center;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.sq.ok{background:var(--okb);color:var(--ok)}
.sq.no{background:var(--nob);color:var(--no)}
.cap{font-size:10.5px;color:var(--mu2)}
.nums{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mu)}
.nums b{color:var(--tx);font-variant-numeric:tabular-nums}
.pie{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-top:1px solid var(--bd);padding-top:9px}
.prob{font-size:22px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1}
.prob small{display:block;font-size:10.5px;color:var(--mu);font-weight:500;margin-top:3px}
.momio{text-align:right;font-variant-numeric:tabular-nums}
.momio .m{font-size:17px;font-weight:700}
.momio .m.aprox{color:var(--mu)}
.momio small{display:block;font-size:10.5px;color:var(--mu)}
.razon{font-size:12.5px;color:#d8dbe4;background:var(--goldb);border-radius:9px;padding:8px 10px}
.pa{font-size:12.5px;color:#f3e2b5;background:var(--goldb);border:1px dashed rgba(255,201,77,.35);border-radius:9px;padding:7px 10px}
.pa b{color:var(--gold)}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--s3);color:var(--mu)}
.tag.w{color:var(--gold)}
.tag.ya{color:var(--no)}
.vacio{color:var(--mu);padding:24px 0}
.lg{width:18px;height:18px;object-fit:contain;flex:none}
.pt{display:inline-flex;align-items:center;gap:5px;min-width:0;white-space:nowrap}
.pt b{font-weight:600;color:#cfd4df}
.at{color:var(--mu2);font-size:11px}
.rk{font-size:10px;color:var(--mu);font-weight:600}
.cab{display:flex;gap:12px;align-items:center;min-width:0}
.cab .txt{overflow-wrap:anywhere}
.av{flex:none;border-radius:50%;background:var(--s3);overflow:hidden;display:grid;place-items:center}
.av img{width:100%;height:100%;object-fit:cover;object-position:center top}
.av img.fb,.av.lgav img{object-fit:contain;width:70%;height:70%}
.av.duo{position:relative;display:block}
.av.duo img{position:absolute;width:54%;height:54%;object-fit:contain}
.av.duo img:first-child{left:9%;top:9%}
.av.duo img:last-child{right:9%;bottom:9%}
.apu{font-size:16.5px;font-weight:700;color:var(--tx);line-height:1.25}
.cuando{font-weight:700;color:var(--tx)}
.define{font-size:12.5px;color:var(--mu);background:var(--s2);border-radius:9px;padding:7px 10px}
.define b{color:var(--gold)}
.legl{display:flex;flex-direction:column;gap:10px}
.lgi{display:flex;gap:10px;align-items:flex-start}
.lgi .t{font-size:13.5px;font-weight:600;line-height:1.25}
.lgi .m{font-size:11.5px;color:var(--mu);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.lgi .pq{font-size:11.5px;color:#b8c0d2;margin-top:4px;line-height:1.35}
.lgi .pq .w{color:var(--gold)}
.lgi .mo{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:13.5px;flex:none}
.lgi .mo small{display:block;font-size:10.5px;color:var(--mu);font-weight:500}
.lgi .ex{flex:none;background:none;border:0;color:var(--mu2);cursor:pointer;font-size:15px;padding:0 2px;line-height:1}
.lgi .ex:hover{color:var(--no)}
.resumen{font-size:12.5px;color:#cfd4df;background:var(--acb);border-radius:9px;padding:8px 10px}
.alcance{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12.5px;color:var(--mu);background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:9px 12px;margin-bottom:14px}
.alcance b{color:var(--tx)}
.link{background:none;border:0;color:var(--ac);cursor:pointer;padding:0;text-decoration:underline}
/* filtros */
.fpanel{background:var(--s1);border:1px solid rgba(111,155,255,.4);border-radius:14px;padding:12px 14px;margin-bottom:14px;display:grid;gap:10px}
.fpanel .fl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12.5px;color:var(--mu)}
.fpanel .fl > b{color:var(--tx);font-weight:600;min-width:86px}
.fpanel input[type=text],.fpanel input[type=number],.fpanel select{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:5px 8px}
.fpanel input[type=number]{width:84px;text-align:right}
.fpanel .chip{font-size:12px;padding:3px 10px}
.fpanel label{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
/* slip */
.slip{position:sticky;top:160px;background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:14px;max-height:calc(100vh - 180px);display:flex;flex-direction:column;overflow-y:auto}
.slip h2{font-size:15px;margin:0 0 2px}
.slip .hint{font-size:12px;color:var(--mu);margin:0 0 10px}
.legs{display:flex;flex-direction:column;gap:8px}
.leg{background:var(--s2);border:1px solid rgba(255,255,255,.03);border-radius:14px;padding:10px 10px 9px;display:grid;grid-template-columns:34px 1fr 28px;gap:2px 10px;align-items:start}
.leg > :first-child{grid-row:1/3;grid-column:1}
.leg .lb{grid-column:2;min-width:0}
.leg .lt{font-size:13.5px;font-weight:600;line-height:1.3;text-wrap:pretty}
.leg .lj{font-size:11.5px;color:var(--mu);margin-top:2px;line-height:1.35}
.leg .lj .cuando{color:#cfd4df;font-weight:600}
.leg .x{grid-column:3;grid-row:1;background:none;border:0;color:var(--mu2);cursor:pointer;font-size:18px;line-height:1;width:28px;height:28px;border-radius:8px}
.leg .x:hover{background:var(--s3);color:var(--no)}
.leg .lf{grid-column:2/4;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.leg .lp{font-size:11.5px;color:var(--mu)}
.leg .lp b{color:var(--tx);font-weight:600}
.leg input{width:88px;background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:6px 9px;text-align:right;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.leg input.aprox{color:var(--mu);border-style:dashed}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.hero > div{background:var(--s2);border-radius:14px;padding:10px 12px}
.hero small{display:block;font-size:11.5px;color:var(--mu)}
.hero b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.hero .cobro{background:linear-gradient(160deg,rgba(255,201,77,.18),rgba(255,201,77,.05));border:1px solid rgba(255,201,77,.25)}
.hero .cobro b{color:var(--gold)}
.hero span{font-size:11.5px;color:var(--mu)}
.montos{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.montos input{width:84px;background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:6px 9px;text-align:right;font-weight:700}
.montos .chip{padding:4px 10px;font-size:12.5px}
.acc{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.acc .ancho{grid-column:1/-1}
.btn.share{background:linear-gradient(135deg,#25d366,#1ebe5b);border-color:#1ebe5b;color:#04220f}
.visor{position:fixed;inset:0;z-index:90;background:rgba(5,6,9,.82);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}
.visor .vcaja{width:min(460px,100%);max-height:100%;display:flex;flex-direction:column;gap:12px}
.visor img{width:100%;max-height:72dvh;object-fit:contain;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.6);background:var(--s1)}
.visor .btns a{text-decoration:none;text-align:center}
.velo{display:none}
/* fuente deportiva para números y títulos */
h1,.prob,.momio .m,.hero b,.kpi b,.pl h3,.lgi .mo,.big,.fe b,.fh,.sec,.fm2{font-family:"Barlow Condensed",Geist,sans-serif;letter-spacing:.01em}
h1{font-weight:800;font-size:23px;letter-spacing:.02em;text-transform:uppercase}
h1 em{font-style:normal;color:var(--gold)}
.prob{font-size:28px;font-weight:700}
.momio .m{font-size:22px}
.hero b{font-size:32px;font-weight:700}
.kpi b{font-size:28px;font-weight:700}
.pl h3{font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.lgi .mo{font-size:19px}
h2.sec{font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.ic{width:18px;height:18px;flex:none;display:inline-block;vertical-align:-3px}
.tab{display:inline-flex;align-items:center;gap:6px}
.tab .ic{opacity:.75}
.tab.on .ic{opacity:1;color:var(--gold)}
.chip .ic{width:15px;height:15px;margin-right:4px;vertical-align:-2px}
/* fichas de partidos */
.grupo{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.grupo:first-of-type{margin-top:4px}
.grupo h2{margin:0;font:700 22px/1 "Barlow Condensed",Geist,sans-serif;text-transform:uppercase;letter-spacing:.03em}
.grupo .ic{width:24px;height:24px;color:var(--gold)}
.grupo span{color:var(--mu);font-size:13px}
.fichas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.ficha{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:14px 12px 10px;cursor:pointer;text-align:center;color:var(--tx);background:var(--s1);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.ficha:hover{border-color:rgba(255,255,255,.16);transform:translateY(-1px)}
.ficha .fe{display:grid;justify-items:center;gap:4px;min-width:0}
.ficha .fe img{width:54px;height:54px;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
.ficha .fe b{font-size:20px;font-weight:700;line-height:1}
.ficha .fe small{font-size:11.5px;color:var(--mu);font-variant-numeric:tabular-nums}
.ficha .fe small.fav{color:var(--ok)}
.ficha .fc{display:grid;gap:1px;color:var(--mu);font-size:12px;min-width:64px}
.ficha .fh{font-size:20px;font-weight:700;color:var(--tx);line-height:1.1}
.ficha .fl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.ficha .fb{grid-column:1/-1;display:flex;justify-content:center;flex-wrap:wrap;gap:5px;margin-top:6px}
.ficha .fb span{font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.06);color:#cfd4df;display:inline-flex;align-items:center;gap:4px}
.ficha .fb span.w{background:var(--goldb);color:var(--gold)}
.ficha .fb .ic{width:12px;height:12px}
.volver{display:inline-flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--bd);border-radius:999px;padding:7px 14px 7px 10px;cursor:pointer;font-weight:600;margin-bottom:12px}
.juego.detalle{border:0;background:transparent}
.juego.detalle .jh{cursor:default;background:var(--s1);border-radius:18px}

/* ===== dopamina: degradados, brillos y animaciones ===== */

.btn.oro{background:linear-gradient(135deg,#ffe28f,#ffc94d 50%,#ff9f43);border:0;box-shadow:0 6px 18px rgba(255,170,60,.25)}

.btn.pri{background:linear-gradient(180deg,#fff,#dfe4ee)}
@keyframes brillo{0%,62%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.tab.on{border-image:linear-gradient(90deg,#ffe28f,#ff9f43) 1}

.add.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.fab.bump{animation:bump .5s cubic-bezier(.2,1.6,.4,1)}

.entra .lista > *,.entra .fichas > *,.entra .legl > *{animation:sube .42s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 38ms)}

.card{background:linear-gradient(180deg,rgba(255,255,255,.025),transparent 40%),var(--s1);transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}

.pbar{height:5px;border-radius:9px;background:var(--s3);overflow:hidden;margin-top:7px;width:120px}

.hero .cobro{box-shadow:0 0 0 1px rgba(255,201,77,.18),0 8px 30px rgba(255,201,77,.12);animation:respira 3.2s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<header><div class="hwrap">

<script>
const D = /*__DATOS__*/null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const P = D.picks;
const DEP = {nba:'NBA', nfl:'NFL', nhl:'NHL', futbol:'FÚT', ncaab:'NCAAB', ncaaf:'NCAAF', ufc:'UFC'};

const ICONOS = {

// ---------- la hora de AHORA (al abrir la página): días, horas y qué partidos ya empezaron
const DIAS_JS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];

const dos = n => String(n).padStart(2, '0');

    const t = new Date(j.fecha), d0 = new Date(t);

    j.t = t;

    j.dl = `${DIAS_JS[t.getDay()]} ${t.getDate()} ${MESES_JS[t.getMonth()]}`;
    j.hora = `${dos(t.getHours())}:${dos(t.getMinutes())}`;

  });
}

// ---------- estado (lo que eliges se queda guardado en el navegador)

let st = {dep:'todos', dia:'todos', tab: guardado('parlay_tab', 'partidos'), filtro:false, juego:null, mas:false, casa:false};
let vistaPrevia = '', ultimoAgregado = null;
let slip = guardado('parlay_slip_v2', []);
let apuesta = +(localStorage.getItem('parlay_apuesta') || 50);
let CASA_SEL = guardado('parlay_casa', D.config.casa || 'Playdoit');
const FILT0 = {q:'', clase:'todas', mercados:[], minProb:0, momMin:'', momMax:'', soloReal:false, soloPA:false, sinAlertas:false, ligas:[], orden:'auto'};
let FILT = {...FILT0, ...guardado('parlay_filtros_v1', {})};
let EXCL = new Set(guardado('parlay_excluidas', []));
let APS = D.apuestas || [], EST_AP = D.estado_ap || {};

// Pago Anticipado según la casa que elegiste
const paActivo = dep => !!(CASAS_PA[CASA_SEL] || {})[dep];
const estDe = p => (p.pa && paActivo(p.deporte)) ? p.pa.est : p.est;
function momioSug(p){ return p.momio ?? amer(Math.max(1.02, 1 / (Math.min(estDe(p), .97) * 1.06))); }
function textoPA(casa){
  const r = CASAS_PA[casa] || {};
  const u = {nba: 'NBA 20', nfl: 'NFL 17', nhl: 'NHL 3 goles', futbol: 'Fútbol 2 goles'};
  const xs = Object.keys(u).filter(k => r[k]).map(k => u[k]);
  return xs.length ? 'PA: ' + xs.join(' · ') : 'sin Pago Anticipado';
}

// ---------- tipos de apuesta (para el filtro)
const CAT_EQ = {ml_L:'ganador', ml_V:'ganador', emp:'ganador', dc_L:'ganador', dc_V:'ganador', spa_L:'ganador', spa_V:'ganador',
  hcp_L:'handicap', hcp_V:'handicap', tot_o:'totales', tot_u:'totales', gL_o:'totales', gV_o:'totales', m1_o:'mitad', m1_u:'mitad',
  btts_si:'ambos', btts_no:'ambos', cor_o:'corners', cor_u:'corners', corL_o:'corners', corV_o:'corners', tar_o:'tarjetas', tar_u:'tarjetas'};
const CAT_JUG = {pts:'puntos', pra:'puntos', reb:'rebotes', ast:'asistencias', tpm:'triples', pyd:'yardas', ruy:'yardas', rey:'yardas',
  recs:'recepciones', td:'td', ptd:'td', sog:'tiros', tir:'tiros', tap:'tiros', gol:'goles', pto:'goles', sv:'atajadas', tar:'tarjetas'};
const MERCADOS = [['ganador','Ganador'],['handicap','Hándicap'],['totales','Totales'],['mitad','1a mitad / periodo'],['ambos','Ambos anotan'],
  ['corners','Córners'],['tarjetas','Tarjetas'],['puntos','Puntos / PRA'],['rebotes','Rebotes'],['asistencias','Asistencias'],['triples','Triples'],
  ['yardas','Yardas'],['recepciones','Recepciones'],['td','Touchdowns'],['tiros','Tiros'],['goles','Goles / puntos (NHL)'],['atajadas','Atajadas']];
const catDe = p => p.clase === 'jugador' ? CAT_JUG[p.stat] : CAT_EQ[p.fam];
const sinAcentos = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const nFiltros = () => [FILT.q, FILT.clase !== 'todas', FILT.mercados.length, FILT.minProb, FILT.momMin !== '', FILT.momMax !== '', FILT.soloReal, FILT.soloPA, FILT.sinAlertas, FILT.ligas.length, FILT.orden !== 'auto'].filter(Boolean).length;
function pasaFILT(p){
  const j = J[p.juego];
  if (FILT.q){
    const q = sinAcentos(FILT.q);
    const donde = sinAcentos([p.texto, p.quien, p.sub, j.L.nombre, j.V.nombre, j.L.corto, j.V.corto].join(' '));
    if (!q.split(/\s+/).every(w => donde.includes(w))) return false;
  }
  if (FILT.clase !== 'todas' && p.clase !== FILT.clase) return false;
  if (FILT.mercados.length && !FILT.mercados.includes(catDe(p))) return false;
  if (FILT.minProb && estDe(p) < FILT.minProb) return false;
  const m = momioSug(p);
  if (FILT.momMin !== '' && m < +FILT.momMin) return false;
  if (FILT.momMax !== '' && m > +FILT.momMax) return false;
  if (FILT.soloReal && p.momio == null) return false;
  if (FILT.soloPA && !(p.pa && paActivo(p.deporte))) return false;
  if (FILT.sinAlertas && (p.alerta || (p.tags || []).some(t => t.startsWith('⚠')))) return false;
  if (FILT.ligas.length && !FILT.ligas.includes(j.liga_nombre)) return false;
  return true;
}
function pasaFiltro(p){
  const j = J[p.juego];
  return j.vivo && (st.dep === 'todos' || p.deporte === st.dep) && (st.dia === 'todos' || j.dia === st.dia) && pasaFILT(p);
}
function ordenar(ps){
  const k = {prob: p => -estDe(p), pago: p => -momioSug(p), valor: p => -(estDe(p) - impl(momioSug(p))), hora: p => +J[p.juego].t}[FILT.orden];
  return k ? [...ps].sort((a, b) => k(a) - k(b)) : ps;
}

// ---------- parlays armados al momento, solo con partidos que no han empezado (y los filtros puestos)
let PLS = [];
const rDe = p => Math.log(dec(momioSug(p))) / -Math.log(Math.min(estDe(p), .99)) * (p.real ? 1 : .9);
function poolParlays(){ return D.pool.map(i => P[i]).filter(p => p && !EXCL.has(p.id) && pasaFiltro(p)); }
function construirParlays(){
  const pool = poolParlays();
  pool.forEach(p => { p._r = rDe(p); });
  // exacto: n patas (una por partido y por equipo, máx. 5 por liga) con la MAYOR probabilidad que todavía pague el objetivo
  const exacta = (n, objetivo, estMin, rango) => {
    const datos = pool.filter(p => estDe(p) >= estMin && (!rango || (momioSug(p) >= rango[0] && momioSug(p) <= rango[1])))
      .map(p => [p, Math.log(Math.min(estDe(p), .99)), Math.log(dec(momioSug(p)))]);
    const elegir = lam => {
      const mejor = {};
      for (const [p, lp, ld] of datos){ const s = lp + lam * ld; if (!mejor[p.juego] || s > mejor[p.juego][0]) mejor[p.juego] = [s, p, ld]; }
      const legs = [], ligas = {}, usados = new Set(); let suma = 0;
      for (const [, p, ld] of Object.values(mejor).sort((a, b) => b[0] - a[0])){
        const g = J[p.juego];
        if ((ligas[p.liga] || 0) >= 5 || usados.has(g.L.id) || usados.has(g.V.id)) continue;
        usados.add(g.L.id); usados.add(g.V.id);
        legs.push(p); ligas[p.liga] = (ligas[p.liga] || 0) + 1; suma += ld;
        if (legs.length === n) break;
      }
      return [legs, suma];
    };
    const meta = Math.log(objetivo);
    let lo = 0, hi = 4, [legs, suma] = elegir(hi);
    if (suma < meta) return legs;
    for (let i = 0; i < 40; i++){ const mid = (lo + hi) / 2, [l2, s2] = elegir(mid); if (s2 >= meta){ hi = mid; legs = l2; } else lo = mid; }
    return legs;
  };
  // una por una, la pata que más paga por el riesgo que agrega; una por partido; mezclando deportes
  const hacer = (nombre, desc, objetivo, maxLegs, estMin, rango, opt = {}) => {
    if (opt.exacto){
      const legs = exacta(maxLegs, objetivo, estMin, rango);
      const d = legs.reduce((a, p) => a * dec(momioSug(p)), 1);
      if (legs.length < maxLegs * .6 || d < objetivo * .5) return null;
      return {nombre, desc, legs: legs.map(p => p.id), monto: opt.monto};
    }
    const legs = [], juegos = new Set(), cuenta = {};
    let d = 1;
    while (legs.length < maxLegs && d < objetivo){
      let mejor = null, mv = -Infinity;
      for (const p of pool){
        if (juegos.has(p.juego) || estDe(p) < estMin) continue;
        if (rango){ const m = momioSug(p); if (m < rango[0] || m > rango[1]) continue; }
        const v = p._r - .15 * (cuenta[p.deporte] || 0);
        if (v > mv){ mv = v; mejor = p; }
      }
      if (!mejor) break;
      legs.push(mejor); juegos.add(mejor.juego);
      cuenta[mejor.deporte] = (cuenta[mejor.deporte] || 0) + 1;
      d *= dec(momioSug(mejor));
    }
    if (legs.length < 2 || (objetivo < 999 && d < objetivo * .6)) return null;
    return {nombre, desc, legs: legs.map(p => p.id), monto: opt.monto};
  };
  return [
    hacer('Lotería', '$10 que hagan $20,000 o más: 18 partidos de varias ligas y días (un partido por equipo), cada pata entre -400 y +250. Casi nunca pega: es para soñar con poquito.', 2000, 18, .5, [-400, 250], {exacto: true, monto: 10}),
    hacer('Escalera de candados', 'Puros favoritos tipo -250 a -600: solos no pagan, juntos sí. Revisa en tu casa los momios con ≈.', 9999, 10, .78, [-650, -230]),
    hacer('Corto', 'Busca +160 o más con las patas más seguras que todavía pagan algo.', 2.6, 4, .65),
    hacer('Mediano', 'Busca +500 o más: equilibrio entre pago y probabilidad.', 6, 6, .6),
    hacer('Bombazo', 'Busca +2000 o más: pegar algo grande con poco. Pega pocas veces, apuesta poquito.', 21, 10, .5),
  ].filter(Boolean);
}

// ---------- por qué cada pata (resumen para estar más seguros)
const media = xs => xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null;
const f1 = x => (Math.round(x * 10) / 10).toLocaleString('es-MX');
function porQue(p){
  const j = J[p.juego], x = [], ojo = [];
  if (p.clase === 'jugador'){
    const vals = p.serie[0].map(s => +s[0]).filter(v => !isNaN(v));
    if (vals.length && !['gol', 'td', 'tar'].includes(p.stat) && !(p.stat === 'pto' && p.umbral === 1) && !(p.stat === 'ptd' && p.umbral === 1))
      x.push(`promedia ${f1(media(vals))} (últimos 5: ${f1(media(vals.slice(0, 5)))}) y la línea es ${p.umbral - .5}`);
    x.push(`la pasó ${p.hits} de ${p.n}${p.h5 === p.n5 ? ', y los últimos 5 seguidos' : ''}`);
    if (p.cancha && p.cancha[1] >= 3) x.push(`${p.lado === 'L' ? 'en casa' : 'de visita'} ${p.cancha[0]}/${p.cancha[1]}`);
  } else {
    const eqs = [j.L.corto, j.V.corto];
    const filas = p.serie.map((s, i) => `${eqs[i]} ${s.filter(v => v[1]).length}/${s.length}`);
    if (['tot_o', 'tot_u', 'm1_o', 'm1_u', 'cor_o', 'cor_u', 'tar_o', 'tar_u'].includes(p.fam)){
      const prom = media(p.serie.flat().map(v => +v[0]).filter(v => !isNaN(v)));
      if (prom != null) x.push(`sus partidos promedian ${f1(prom)}`);
    }
    x.push(`se cumplió en los partidos de ${filas.join(' y ')}`);
    if (p.cancha && p.cancha[1] >= 4) x.push(`en su cancha ${p.cancha[0]}/${p.cancha[1]}`);
  }
  const r = p.hits / p.n;
  if (p.p_mkt) x.push(r >= p.p_mkt + .08 ? `la historia (${pct(r)}) le gana a lo que da la casa (${pct(p.p_mkt)})` : `la casa lo ve en ${pct(p.p_mkt)}`);
  if (p.pa && paActivo(p.deporte) && p.pa.extra >= .01) x.push(`con PA de ${CASA_SEL} sube a ${pct(p.pa.est)}`);
  for (const t of p.tags || []){
    if (t.startsWith('⚠')) ojo.push(t.replace('⚠ ', ''));
    else if (t.startsWith('rival') || t.startsWith('ESPN') || t.startsWith('🌬') || t.startsWith('árbitro')) x.push(t);
  }
  if (p.razon && p.joya) x.push(p.razon.split('. ')[0]);
  return x.join(' · ') + (ojo.length ? ` <span class="w">· Ojo: ${esc(ojo.join(', '))}</span>` : '');
}

// ---------- piezas visuales

function cdn(url, w, h){

// silueta para cuando ESPN no tiene foto del peleador
const SILUETA = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" fill="#222838"/><circle cx="20" cy="15" r="7" fill="#3a4358"/><path d="M6 40c1-9 7-14 14-14s13 5 14 14z" fill="#3a4358"/></svg>');
function logo(url, s = 18, cls = 'lg'){
  if (!url) return '';
  if (url.includes('/headshots/'))  // peleadores: foto en círculo
    return `<img class="${cls}" loading="lazy" src="${cdn(url, Math.round(s * 2.75), s * 2)}" style="object-fit:cover;object-position:center top;border-radius:50%;background:#222838" onerror="this.onerror=null;this.src=SILUETA" alt="">`;

}
const rk = e => e.rank ? `<span class="rk">#${e.rank}</span>` : '';
function partidoHTML(j, s = 16){

}
function avatar(p, s = 42){
  const j = J[p.juego], sty = `style="width:${s}px;height:${s}px"`;
  if (p.clase === 'jugador'){
    const eq = j[p.lado] || {};
    const fb = cdn((eq.logo || '').replace('/500/', '/500-dark/'), s * 2, s * 2);
    return `<span class="av" ${sty}><img loading="lazy" src="${cdn(p.foto, Math.round(s * 2.75), s * 2)}" onerror="this.onerror=null;this.className='fb';this.src='${fb}'" alt=""></span>`;
  }
  if (p.lado && (j[p.lado].logo || '').includes('/headshots/')) return `<span class="av" ${sty}>${logo(j[p.lado].logo, s, '')}</span>`;
  if (p.lado) return `<span class="av lgav" ${sty}>${logo(j[p.lado].logo, Math.round(s * .7), '')}</span>`;
  const a = esFut(j) ? j.L : j.V, b = esFut(j) ? j.V : j.L;
  return `<span class="av duo" ${sty}>${logo(a.logo, Math.round(s * .55), '')}${logo(b.logo, Math.round(s * .55), '')}</span>`;
}
function titulo(p){
  return p.clase === 'jugador'
    ? {t: p.quien, s: `${p.sub} · ${p.liga}`, a: p.apuesta}
    : {t: p.apuesta || p.texto, s: `${p.sub} · ${p.liga}`, a: ''};
}
function textoPata(p){ return p.clase === 'jugador' ? `${p.quien}: ${p.apuesta}` : (p.apuesta || p.texto); }
function legHTML(p, opts = {}){
  const j = J[p.juego], m = momioSug(p);
  return `<div class="lgi">${avatar(p, 32)}<div style="min-width:0;flex:1"><div class="t">${esc(textoPata(p))}</div>
    <div class="m"><span class="cuando">${esc(cuando(j, true))}</span><span class="dep ${p.deporte}">${DEP[p.deporte]}</span>${partidoHTML(j, 13)}${p.joya ? '<span class="tag w">joyita</span>' : ''}${p.pa && paActivo(p.deporte) ? '<span class="tag w">PA</span>' : ''}</div>
    ${opts.porque ? `<div class="pq">${porQue(p)}</div>` : ''}</div>
    <div class="mo">${fmtM(m)}${p.momio == null ? ' ≈' : ''}<small>${pct(estDe(p))}</small></div>
    ${opts.excluir ? `<button class="ex" data-excluir="${p.id}" title="No me late: quitarla y rearmar">×</button>` : ''}</div>`;
}
function serieHTML(p){
  const j = J[p.juego], eqs = [j.L, j.V];  // en apuestas de partido: fila 1 local, fila 2 visita
  return p.serie.map((s, i) => `<div class="srow">${p.serie.length > 1 ? `<span class="slab" title="${esc(eqs[i].nombre)}">${logo(eqs[i].logo, 14)}${esc(p.nombres[i])}</span>` : ''}
    <div class="sqs">${s.slice(0, 10).reverse().map(([v, ok]) => `<span class="sq ${ok ? 'ok' : 'no'}">${esc(v)}</span>`).join('')}</div></div>`).join('');
}
function paHTML(p){
  if (!p.pa) return '';
  const uni = p.deporte === 'futbol' || p.deporte === 'nhl' ? 'goles' : 'puntos';
  const casas = CASAS.filter(c => (CASAS_PA[c] || {})[p.deporte]).join(', ');
  const enc = paActivo(p.deporte) ? `con <b>Pago Anticipado de ${esc(CASA_SEL)}</b>` : `si juegas en ${esc(casas || 'una casa con PA')}, con <b>Pago Anticipado</b>`;
  return `<div class="pa">${enc} (si llega a ir arriba por ${p.pa.umbral} ${uni} se paga aunque luego pierda): <b>${pct(p.pa.est)}</b> · en su historia se habría pagado ${p.pa.hits}/${p.pa.n}</div>`;
}
function card(p, k = 0){
  const j = J[p.juego], en = slip.some(l => l.id === p.id);
  const cancha = p.cancha && p.cancha[1] >= 3 ? `<span>${p.clase === 'jugador' ? (p.lado === 'L' ? 'en casa' : 'de visita') : 'en su cancha'} <b>${p.cancha[0]}/${p.cancha[1]}</b></span>` : '';
  const momio = p.momio != null
    ? `<div class="m">${fmtM(p.momio)}</div><small>${esc(p.casa_prop || (j.momios || {}).casa || 'casa')}</small>`
    : `<div class="m aprox">≈ ${fmtM(p.justo)}</div><small>momio justo</small>`;
  const tt = titulo(p);
  return `<article class="card ${p.joya ? 'joya' : ''} ${p.candado ? 'cand' : ''}" style="--i:${Math.min(k, 14)}">
    <div class="meta"><span class="dep ${p.deporte}">${DEP[p.deporte]}</span>
      <span class="jg pt" data-juego="${j.id}" style="cursor:pointer" title="Ver el partido">${partidoHTML(j, 15)} <span>· ${esc(cuando(j))}</span></span>
      <button class="add ${en ? 'in' : ''}" data-add="${p.id}" title="Agregar a mi parlay">${en ? '✓' : '+'}</button></div>
    <div class="cab">${avatar(p)}<div><div class="txt">${esc(tt.t)}</div><div class="sub">${esc(tt.s)}</div></div></div>
    ${tt.a ? `<div class="apu">${esc(tt.a)}</div>` : ''}
    ${p.razon ? `<div class="razon">${esc(p.razon)}</div>` : ''}
    ${paHTML(p)}
    <div>${serieHTML(p)}<div class="cap">${p.clase === 'equipo' ? 'partidos recientes de cada equipo' : 'partidos recientes'} · el más nuevo a la derecha</div></div>
    <div class="nums"><span>se cumplió <b>${p.hits}/${p.n}</b></span><span>últimos 5: <b>${p.h5}/${p.n5}</b></span>${cancha}</div>
    ${p.tags && p.tags.length ? `<div class="tags">${p.tags.map(t => `<span class="tag ${t.startsWith('⚠') ? 'w' : ''}">${esc(t)}</span>`).join('')}</div>` : ''}
    <div class="pie"><div class="prob">${pct(estDe(p))}<small>probabilidad estimada${p.pa && paActivo(p.deporte) ? ' (con PA)' : ''}</small><div class="pbar"><i style="width:${Math.round(estDe(p) * 100)}%"></i></div></div><div class="momio">${momio}</div></div>
  </article>`;
}
function comboHTML(c){
  const a = P[c.a], b = P[c.b], j = J[c.juego];
  const ambos = slip.some(l => l.id === c.a) && slip.some(l => l.id === c.b);
  return `<article class="card combo">
    <div class="meta"><span class="dep ${a.deporte}">${DEP[a.deporte]}</span><span class="jg pt">${partidoHTML(j, 15)} <span>· ${esc(cuando(j))}</span></span>
      <button class="add ${ambos ? 'in' : ''}" data-combo="${c.id}" title="Agregar las dos">${ambos ? '✓' : '+'}</button></div>
    <div class="legl">${legHTML(a)}${legHTML(b)}</div>
    <div class="razon" style="background:var(--acb)">Pegaron <b>juntas ${c.hits}/${c.n}</b> en sus partidos recientes. Van de la mano (${c.lift.toFixed(2)}x más que si fueran independientes). En tu casa búscalas como "Crea tu apuesta" o "mismo partido".</div>
    <div class="pie"><div class="prob">${pct(c.est)}<small>las dos juntas</small></div><div class="momio"><div class="m aprox">≈ ${fmtM(amer(1 / c.est))}</div><small>momio justo de las dos</small></div></div>
  </article>`;
}

// ---------- panel de filtros
function filtroHTML(){
  if (!st.filtro) return '';
  const ligas = [...new Set(vivos().map(j => j.liga_nombre))];
  const ch = (k, v, t) => `<button class="chip ${FILT[k].includes(v) ? 'on' : ''}" data-fmulti="${k}|${esc(v)}">${esc(t)}</button>`;
  return `<div class="fpanel">
    <div class="fl"><b>Buscar</b><input type="text" data-f="q" value="${esc(FILT.q)}" placeholder="equipo o jugador (ej. Lakers, Mahomes)">
      ${['todas', 'equipo', 'jugador'].map(c => `<button class="chip ${FILT.clase === c ? 'on' : ''}" data-fset="clase|${c}">${{todas: 'Todas', equipo: 'De equipo', jugador: 'De jugador'}[c]}</button>`).join('')}</div>
    <div class="fl"><b>Tipo</b>${MERCADOS.map(([k, t]) => ch('mercados', k, t)).join('')}</div>
    <div class="fl"><b>Momio</b> de <input type="number" data-f="momMin" value="${esc(FILT.momMin)}" placeholder="-650"> a <input type="number" data-f="momMax" value="${esc(FILT.momMax)}" placeholder="+500">
      <b style="min-width:auto;margin-left:10px">Prob. mínima</b>${[0, .6, .7, .8, .9].map(v => `<button class="chip ${FILT.minProb === v ? 'on' : ''}" data-fset="minProb|${v}">${v ? Math.round(v * 100) + '%' : 'Cualquiera'}</button>`).join('')}</div>
    <div class="fl"><b>Solo</b><label><input type="checkbox" data-fchk="soloReal" ${FILT.soloReal ? 'checked' : ''}> con momio real</label>
      <label><input type="checkbox" data-fchk="soloPA" ${FILT.soloPA ? 'checked' : ''}> con Pago Anticipado de ${esc(CASA_SEL)}</label>
      <label><input type="checkbox" data-fchk="sinAlertas" ${FILT.sinAlertas ? 'checked' : ''}> sin alertas (⚠)</label></div>
    <div class="fl"><b>Ligas</b>${ligas.map(l => ch('ligas', l, l)).join('')}</div>
    <div class="fl"><b>Ordenar</b>${[['auto', 'Recomendado'], ['prob', 'Más probable'], ['pago', 'Más paga'], ['valor', 'Más valor (vs la casa)'], ['hora', 'Por hora']].map(([k, t]) => `<button class="chip ${FILT.orden === k ? 'on' : ''}" data-fset="orden|${k}">${t}</button>`).join('')}
      <button class="btn chico" data-flimpiar="1" style="margin-left:auto">Limpiar filtros</button></div>
  </div>`;
}

// ---------- pestañas
function vista(){
  const m = $('#main');
  if (st.tab === 'candados' || st.tab === 'joyitas'){
    let ids = D[st.tab].filter(i => pasaFiltro(P[i]));
    if (st.tab === 'candados') ids = ids.filter(i => momioSug(P[i]) >= MOMIO_MIN_CANDADO);
    ids = ordenar(ids.map(i => P[i])).map(p => p.id);
    const intro = st.tab === 'candados'
      ? `<p class="intro"><b>Lo obvio, pero que todavía paga.</b> Se cumplió en 9 de cada 10 partidos recientes (o más), no falló en los últimos 5 y paga mejor que -650 (los de -700 para abajo no salen: casi no pagan). Para cada jugador o mercado sale la línea más alta que se sigue cumpliendo.</p>`
      : `<p class="intro"><b>Lo que nadie está viendo.</b> Apuestas donde la casa paga más de lo que dice la historia, jugadores que rinden más cuando falta su estrella, a los que les dieron más minutos o que enfrentan a un rival que deja mucho. Muestras chicas: úsalas como 1 o 2 patas que suben el momio, no como base.</p>`;
    let html = filtroHTML() + avisoHTML() + como() + intro + (ids.length ? `<div class="lista">${ids.map((i, k) => card(P[i], k)).join('')}</div>` : `<div class="vacio">Nada con estos filtros.</div>`);
    if (st.tab === 'joyitas'){
      const cs = D.combos.filter(c => pasaFiltro(P[c.a]) && pasaFiltro(P[c.b]));
      html += `<h2 class="sec">Combinadas del mismo partido</h2><p class="intro">Dos apuestas del mismo partido que en la historia del equipo pegaron juntas y se refuerzan (si pasa una, es más fácil que pase la otra).</p>`
        + (cs.length ? `<div class="lista">${cs.map(comboHTML).join('')}</div>` : `<div class="vacio">Ninguna con estos filtros.</div>`);
    }
    m.innerHTML = html;
  } else if (st.tab === 'parlays'){
    const js = vivos().filter(j => (st.dep === 'todos' || j.tipo === st.dep) && (st.dia === 'todos' || j.dia === st.dia));
    const quedanHoy = vivos().filter(j => j.dia === 'Hoy' && (st.dep === 'todos' || j.tipo === st.dep)).length;
    const alcance = `<div class="alcance"><span>Armados con: <b>${st.dia === 'todos' ? 'todos los días' : esc(st.dia)}</b> · <b>${st.dep === 'todos' ? 'todos los deportes' : esc(D.deportes[st.dep])}</b>${nFiltros() ? ` · <b>${nFiltros()} filtro${nFiltros() > 1 ? 's' : ''}</b>` : ''}</span>
      <span>Son las <b>${horaAhora()}</b>: solo partidos que no han empezado (<b>${js.length}</b>)</span>
      <span>Casa: <b>${esc(CASA_SEL)}</b> (${esc(textoPA(CASA_SEL))})</span>
      ${EXCL.size ? `<span>Quitaste ${EXCL.size} pata${EXCL.size > 1 ? 's' : ''} · <button class="link" data-restablecer="1">restablecer</button></span>` : ''}
      ${st.dia === 'Hoy' && js.length && js.length < 10 ? `<span>Hoy quedan ${js.length} partidos: los parlays pueden tener hasta ${js.length} patas.</span>` : ''}</div>`;
    let vacio = 'No hay suficientes patas con estos filtros para armar parlays.';
    if (st.dia === 'Hoy' && !quedanHoy){
      const man = vivos().filter(j => j.dia === 'Mañana').length;
      vacio = `Ya no quedan partidos hoy (son las ${horaAhora()}).${man ? ` Mañana hay ${man}: dale al filtro "Mañana".` : ''}`;
    }
    m.innerHTML = filtroHTML() + como() + alcance + (D.odds_txt ? `<div class="aviso" style="margin-bottom:12px">${esc(D.odds_txt)}</div>` : '')
      + `<p class="intro"><b>Armados al momento de abrir la página, mezclando deportes</b> (uno por partido para que no estén amarrados entre sí). Abajo de cada pata está <b>por qué</b> entró. Si una no te late, dale <b>×</b> y el parlay se rearma sin ella. Los momios con ≈ son aproximados: cámbialos por los de tu casa en "Mi parlay".</p>` +
      (PLS.length ? `<div class="lista pls">${PLS.map((pl, k) => {
        const legs = pl.legs.map(i => P[i]).sort((a, b) => J[a.juego].t - J[b.juego].t);
        const d = legs.reduce((a, p) => a * dec(momioSug(p)), 1);
        const prob = legs.reduce((a, p) => a * estDe(p), 1);
        const j0 = J[legs[0].juego], j1 = J[legs[legs.length - 1].juego];
        const floja = legs.reduce((a, p) => estDe(p) < estDe(a) ? p : a, legs[0]);
        const reales = legs.filter(p => p.momio != null).length, joyas = legs.filter(p => p.joya).length;
        const deps = [...new Set(legs.map(p => D.deportes[p.deporte]))];
        const resumen = `${legs.length} patas de ${deps.join(', ')}; ${reales} con momio real de la casa${joyas ? `, ${joyas} joyita${joyas > 1 ? 's' : ''}` : ''}. Cada pata pega en promedio ${pct(Math.pow(prob, 1 / legs.length))}. La más floja: <b>${esc(textoPata(floja))}</b> (${pct(estDe(floja))}); si no te convence, quítala con ×.`;
        return `<div class="pl" style="--i:${k}"><div><h3>${esc(pl.nombre)} · ${legs.length} patas</h3><p class="d">${esc(pl.desc)}</p></div>
          <div class="define">Empieza <b>${esc(cuando(j0, true))}</b> · se define <b>${esc(cuando(j1, true))}</b> (cobras cuando termina el último)</div>
          <div class="resumen">${resumen}</div>
          <div class="legl">${legs.map(p => legHTML(p, {porque: true, excluir: true})).join('')}</div>
          <div class="res"><div>Momio<b>${fmtM(amer(d))}</b></div><div>Con ${pesos(pl.monto || apuesta)} cobras<b>${pesos((pl.monto || apuesta) * d)}</b></div><div>Prob. estimada<b>${pct(prob)}</b></div>${prob < .01 ? `<div>Pega<b>1 de ${Math.round(1 / prob).toLocaleString('es-MX')}</b></div>` : ''}</div>
          <button class="btn pri" data-cargar="${k}">Cargar en mi parlay</button></div>`;
      }).join('')}</div>` : `<div class="vacio">${esc(vacio)}</div>`);
  } else if (st.tab === 'partidos'){
    const jsel = st.juego && J[st.juego];
    if (jsel && jsel.vivo){
      m.innerHTML = `<button class="volver" data-volver="1">${ic('atras')} Partidos</button>` + juegoHTML(jsel, true);
      return;
    }
    st.juego = null;
    const js = vivos().filter(j => (st.dep === 'todos' || j.tipo === st.dep) && (st.dia === 'todos' || j.dia === st.dia)
      && (!FILT.ligas.length || FILT.ligas.includes(j.liga_nombre))
      && (!FILT.q || j.picks.some(i => pasaFILT(P[i])) || sinAcentos(j.L.nombre + ' ' + j.V.nombre).includes(sinAcentos(FILT.q))));
    const orden = ['nfl', 'nba', 'nhl', 'futbol', 'ufc', 'ncaaf', 'ncaab'];
    const grupos = {};
    for (const j of js) (grupos[j.liga_nombre] = grupos[j.liga_nombre] || []).push(j);
    const claves = Object.keys(grupos).sort((a, b) => (orden.indexOf(grupos[a][0].tipo) - orden.indexOf(grupos[b][0].tipo)) || (grupos[a][0].t - grupos[b][0].t));
    m.innerHTML = filtroHTML() + (js.length ? claves.map(k => `<div class="grupo">${ic(grupos[k][0].tipo)}<h2>${esc(k)}</h2><span>${grupos[k].length} ${grupos[k][0].tipo === 'ufc' ? 'pelea' : 'partido'}${grupos[k].length > 1 ? 's' : ''}</span></div>
      <div class="fichas">${grupos[k].map((j, i) => fichaHTML(j, i)).join('')}</div>`).join('') : `<div class="vacio">Nada con estos filtros.</div>`);
  } else if (st.tab === 'apuestas'){
    m.innerHTML = apuestasHTML();
  } else if (st.tab === 'stats'){
    m.innerHTML = statsHTML();
  } else {
    m.innerHTML = historialHTML();
  }
}

function contextoHTML(j){
  const pv = j.previo || {}, x = [];
  if (pv.espn && pv.espn.L != null){
    const [a, b] = esFut(j) ? ['L', 'V'] : ['V', 'L'];
    x.push(`ESPN: ${esc(j[a].corto)} ${Math.round(pv.espn[a])}% · ${esc(j[b].corto)} ${Math.round(pv.espn[b])}%`);
  }
  if (pv.h2h){
    const ps = pv.h2h.partidos.map(p => `${p.V} ${p.Vs}-${p.Ls} ${p.L}`).join(' · ');
    x.push(`Entre ellos: ${esc(pv.h2h.titulo)}${ps ? ' (' + esc(ps) + ')' : ''}`);
  }
  for (const l of ['V', 'L']){
    const e = j[l];
    if (e.cansado) x.push(`<b class="w">${esc(e.corto)}: ${esc(e.cansado)}</b>`);
    else if (e.descanso != null && e.descanso <= 10 && j.tipo !== 'futbol') x.push(`${esc(e.corto)}: ${e.descanso} día${e.descanso === 1 ? '' : 's'} de descanso`);
    if (e.portero) x.push(`Portero ${esc(e.corto)}: ${esc(e.portero.nombre)} (abrió ${e.portero.abrio} de ${e.portero.n})`);
  }
  if (pv.clima && !j.indoor){
    const c = pv.clima;
    x.push(`${j.clima_alerta ? '<b class="w">' : ''}Clima: ${esc(j.clima_txt || '')}${c.temp_c != null ? ' ' + c.temp_c + '°C' : ''}${c.rafaga_kmh != null ? ' · ráfagas ' + c.rafaga_kmh + ' km/h' : ''}${c.lluvia != null ? ' · lluvia ' + Math.round(c.lluvia) + '%' : ''}${j.clima_alerta ? '</b>' : ''}`);
  } else if (j.indoor && j.base === 'nfl') x.push('Estadio techado');
  if (j.arbitro_txt) x.push(`Árbitro ${esc(j.arbitro_txt)}`);
  if (j.division) x.push(`${esc(j.division)}${j.estelar ? ' · pelea estelar' : ''}`);
  for (const t of j.peleadores || []) x.push(esc(t));
  return x.length ? `<div class="ctx">${x.map(t => t.startsWith('<b class="w">') ? `<span class="w">${t.replace('<b class="w">', '').replace('</b>', '')}</span>` : `<span>${t}</span>`).join('')}</div>` : '';
}

// ficha de partido (inicio): logos grandes, siglas, hora, momio y cuántos candados/joyitas tiene
function fichaHTML(j, i = 0){
  const [a, b] = esFut(j) ? [j.L, j.V] : [j.V, j.L];
  const o = j.momios || {};
  const mlA = esFut(j) ? o.ml_L : o.ml_V, mlB = esFut(j) ? o.ml_V : o.ml_L;
  const col = c => c && c !== '000000' && c !== 'ffffff' ? '#' + c : '#3a4256';
  const fondo = `background:radial-gradient(130% 120% at 0% 0%,${col(a.color)}40,transparent 52%),radial-gradient(130% 120% at 100% 100%,${col(b.color)}40,transparent 52%),linear-gradient(180deg,#171b26,#11151d)`;
  const nC = D.candados.filter(id => P[id].juego === j.id && momioSug(P[id]) >= MOMIO_MIN_CANDADO).length;
  const nJ = D.joyitas.filter(id => P[id].juego === j.id).length;
  const conPA = j.picks.some(id => P[id].pa && paActivo(P[id].deporte));
  const eq = (e, ml) => `<div class="fe">${logo(e.logo, 54, '')}<b>${esc(e.abbr)}</b><small class="${ml != null && ml < 0 ? 'fav' : ''}">${ml != null ? fmtM(ml) : '—'}</small></div>`;
  return `<button class="ficha" style="${fondo};--i:${i}" data-juego="${j.id}" aria-label="${esc(nomJuego(j))}">
    ${eq(a, mlA)}<div class="fc"><span>${esc(j.dia)}</span><span class="fh">${esc(j.hora)}</span>${o.total ? `<span class="fl">O/U ${o.total}</span>` : ''}</div>${eq(b, mlB)}
    ${nC || nJ || conPA ? `<div class="fb">${nC ? `<span class="w">${ic('candados')}${nC}</span>` : ''}${nJ ? `<span>${ic('joyitas')}${nJ}</span>` : ''}${conPA ? '<span>PA</span>' : ''}</div>` : ''}
  </button>`;
}

function juegoHTML(j, detalle = false){
  const o = j.momios || {};
  const mov = [];
  if (o.total_abrio && o.total && o.total_abrio !== o.total) mov.push(`total abrió ${o.total_abrio} → ${o.total}`);
  if (o.sp_L_abrio != null && o.sp_L != null && o.sp_L_abrio !== o.sp_L) mov.push(`hándicap ${j.L.corto} abrió ${fmtM2(o.sp_L_abrio)} → ${fmtM2(o.sp_L)}`);
  const eqOdd = (e, m) => `<span class="pt">${logo(e.logo, 14)}${esc(e.corto)} <b>${fmtM(m)}</b></span>`;
  const odds = j.momios ? `${eqOdd(j.V, o.ml_V)}${o.ml_E ? `<span>Empate <b>${fmtM(o.ml_E)}</b></span>` : ''}${eqOdd(j.L, o.ml_L)}${o.total ? `<span>Total <b>${o.total}</b></span>` : ''}${o.sp_L != null && j.tipo !== 'futbol' ? `<span>${esc(j.L.corto)} <b>${fmtM2(o.sp_L)}</b></span>` : ''}` : '<span>sin momios aún</span>';
  const les = ['V', 'L'].map(l => {
    const xs = (j.lesiones[l] || []).slice(0, 7);
    return xs.length ? `<div class="les"><span class="pt">${logo(j[l].logo, 14)}${esc(j[l].corto)}:</span> ${xs.map(x => `${esc(x.nombre)} <b>${esc(x.estado)}</b>`).join(' · ')}</div>` : '';
  }).join('');
  const forma = s => `<span class="fm">${[...(s || '')].reverse().map(c => `<i class="${c}">${c}</i>`).join('')}</span>`;
  const [a, b] = esFut(j) ? [j.L, j.V] : [j.V, j.L];
  const rows = ordenar(j.picks.map(i => P[i]).filter(pasaFILT)).map(p => {

// ---------- mis apuestas
function cobroDe(a, e){
  if (a.resultado === 'cashout') return +a.cobrado || 0;
  if (e === 'gano') return +a.monto * dec(+a.momio);
  return 0;
}
function apuestasHTML(){
  const lista = [...APS].sort((x, y) => (y.creada || '').localeCompare(x.creada || ''));
  const estDeAp = a => a.resultado || (EST_AP[a.id] || {}).estado || 'pendiente';
  let apostado = 0, cobrado = 0, cerradas = 0, ganadas = 0, enJuego = 0, mes = 0;
  const ym = `${AHORA.getFullYear()}-${dos(AHORA.getMonth() + 1)}`;
  const porCasa = {};
  for (const a of lista){
    const e = estDeAp(a), m = +a.monto || 0;
    if ((a.creada || '').startsWith(ym)) mes += m;
    if (e === 'pendiente'){ enJuego += m; continue; }
    apostado += m; cerradas++;
    const c = cobroDe(a, e);
    cobrado += c;
    if (e === 'gano' || (e === 'cashout' && c > m)) ganadas++;
    const pc = porCasa[a.casa || 'Otra'] = porCasa[a.casa || 'Otra'] || {n: 0, neto: 0};
    pc.n++; pc.neto += c - m;
  }
  const neto = cobrado - apostado, tope = +D.config.tope || 0;
  const kpis = `<div class="kpis">
    <div class="kpi"><small>Apostado (cerradas)</small><b>${pesos(apostado)}</b></div>
    <div class="kpi"><small>Cobrado</small><b>${pesos(cobrado)}</b></div>
    <div class="kpi"><small>Ganancia neta</small><b class="${neto >= 0 ? 'pos' : 'neg'}">${pesos(neto)}</b></div>
    <div class="kpi"><small>Pegaron</small><b>${ganadas}/${cerradas}</b></div>
    <div class="kpi"><small>En juego</small><b>${pesos(enJuego)}</b></div>
    <div class="kpi"><small>Este mes${tope ? ' (tope ' + pesos(tope) + ')' : ''}</small><b>${pesos(mes)}</b>${tope ? `<div class="barra"><i style="width:${Math.min(100, mes / tope * 100)}%;${mes > tope ? 'background:var(--no)' : ''}"></i></div>` : ''}</div>
    ${Object.entries(porCasa).map(([c, v]) => `<div class="kpi"><small>${esc(c)} · ${v.n} cerrada${v.n > 1 ? 's' : ''}</small><b class="${v.neto >= 0 ? 'pos' : 'neg'}">${pesos(v.neto)}</b></div>`).join('')}
  </div>`;
  const nota = SERVIDOR ? '' : `<div class="aviso w" style="margin-bottom:12px">Para registrar o marcar apuestas abre la página desde el acceso directo <b>Parlays</b> (así se guardan). Aquí solo se ven.</div>`;
  const intro = `<p class="intro"><b>Tus apuestas.</b> Regístralas con "Lo metí" en Mi parlay (o pásamelas por el chat). Cada vez que corras Parlays se califican solas con los resultados de ESPN, incluido el Pago Anticipado de la casa donde la metiste. Si algo no cuadra, márcalo a mano.</p>`;
  const cards = lista.map(a => {
    const e = estDeAp(a), ea = EST_AP[a.id] || {}, legsE = ea.legs || [];
    const icon = s => ({gano: '✓', gano_pa: '✓', perdio: '✗', anulada: '–', pendiente: '·', sin_dato: '?'}[s] || '·');
    const legs = (a.legs || []).map((l, i) => {
      const le = (l.resultado) || (legsE[i] || {}).estado || 'pendiente';
      const val = (legsE[i] || {}).valor;
      return `<div class="al"><span class="ic ${le}">${icon(le)}</span><div>${esc(l.texto)} <small>${l.momio != null ? fmtM(l.momio) + ' · ' : ''}${esc(l.partido || '')}${l.fecha ? ' · ' + fechaCorta(l.fecha) : ''}${val != null ? ' · quedó ' + val : ''}${le === 'gano_pa' ? ' · pagó por Pago Anticipado' : ''}</small></div></div>`;
    }).join('');
    const nombreE = {gano: 'Ganó', perdio: 'Perdió', pendiente: 'Pendiente', cashout: 'Cash out'}[e] || e;
    const c = cobroDe(a, e);
    const cob = cubrir[a.id] ? coberturaHTML(a) : '';
    return `<div class="ap"><div class="hd"><span class="est ${e}">${nombreE}</span><b>${pesos(+a.monto || 0)}</b> a <b>${fmtM(+a.momio)}</b> · ${esc(a.casa || '')} · ${a.creada ? fechaCorta(a.creada) : ''}
        <span style="margin-left:auto">${e === 'pendiente' ? 'cobrarías ' + pesos((+a.monto || 0) * dec(+a.momio)) : (c ? 'cobraste ' + pesos(c) : '')}</span></div>
      ${legs}${cob}
      ${SERVIDOR ? `<div class="btns"><button class="btn chico" data-res="${a.id}|gano">Ganó</button><button class="btn chico" data-res="${a.id}|perdio">Perdió</button><button class="btn chico" data-res="${a.id}|cashout">Cash out…</button>${a.resultado ? `<button class="btn chico" data-res="${a.id}|">Quitar marca</button>` : ''}${e === 'pendiente' ? `<button class="btn chico" data-cubrir="${a.id}">Cubrir</button>` : ''}<button class="btn chico" data-borrar="${a.id}" style="margin-left:auto;color:var(--no)">Borrar</button></div>` : ''}
    </div>`;
  }).join('');
  return nota + intro + kpis + calcLibreHTML() + (cards || `<div class="vacio">Todavía no registras apuestas.</div>`);

function coberturaHTML(a){
  const cobro = (+a.monto || 0) * dec(+a.momio);
  const m = cubrir[a.id].momio;
  let res = '<span>Pon el momio del otro lado de tu última pata.</span>';
  if (Math.abs(m) >= 100){
    const h = cobro / dec(m), gan = cobro - h - a.monto;
    res = `<span>Apuesta <b>${pesos(h)}</b> al otro lado a ${fmtM(m)} → pase lo que pase te quedan <b class="${gan >= 0 ? 'ok' : 'no'}">${pesos(gan)}</b> de ganancia (sin cubrir: ${pesos(cobro - a.monto)} o pierdes ${pesos(a.monto)}).</span>`;
  }
  return `<div class="cob"><b>Calculadora de cobertura</b><span>Sirve cuando ya nada más falta la última pata. Si pega tu parlay cobras ${pesos(cobro)}.</span>
    <span>Momio del otro lado: <input data-cobm="${a.id}" value="${m || ''}" placeholder="-150" inputmode="numeric"></span>${res}</div>`;
}
let LIBRE = {cobro: '', momio: '', monto: ''};
function calcLibreHTML(){
  const c = +LIBRE.cobro, m = +LIBRE.momio, s = +LIBRE.monto || 0;
  let r = '';
  if (c > 0 && Math.abs(m) >= 100){
    const h = c / dec(m);
    r = `<span>Apuesta <b>${pesos(h)}</b> al otro lado → te quedan <b class="${c - h - s >= 0 ? 'ok' : 'no'}">${pesos(c - h - s)}</b> pase lo que pase.</span>`;
  }
  return `<details class="como"><summary>Calculadora de cobertura (cualquier parlay)</summary><div class="cob" style="margin-top:8px">
    <span>Si pega cobras: <input data-libre="cobro" value="${LIBRE.cobro}" placeholder="1000"> · lo que apostaste: <input data-libre="monto" value="${LIBRE.monto}" placeholder="50"> · momio del otro lado: <input data-libre="momio" value="${LIBRE.momio}" placeholder="-150"></span>${r}</div></details>`;
}

async function preguntarIA(){
  const q = ($('#ia-q') || {}).value || IA.q;
  if (!q.trim() || IA.cargando) return;
  IA.q = ''; IA.cargando = true;
  const previas = IA.conv.filter(x => x.r).slice(-2).map(x => ({p: x.p, r: x.r}));
  const item = {p: q.trim()};
  IA.conv.push(item); render();
  try {
    const r = await (await fetch('/api/preguntar', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({pregunta: q, previas})})).json();
    if (r.error) item.error = r.error;
    else { item.r = r.respuesta; item.meta = `${(r.fuentes || []).map(f => f.startsWith('http') ? `<a href="${esc(f)}" target="_blank" rel="noopener" style="color:var(--ac)">TeamRankings</a>` : esc(f)).join(' · ')}${r.costo_usd != null ? ` · costó ≈ US$${r.costo_usd.toFixed(3)}` : ''}`; }
  } catch { item.error = 'No se pudo preguntar: ¿está abierta la ventanita de Parlays?'; }
  IA.cargando = false; render();
}
async function buscarTR(){
  TR.q = ($('#tr-q') || {}).value || TR.q; TR.dep = ($('#tr-dep') || {}).value || TR.dep;
  if (!TR.q.trim()) return;
  TR.cargando = 'Buscando en TeamRankings… (la primera vez de cada deporte tarda ~10 s)'; TR.msg = ''; render();
  try {
    const r = await (await fetch(`/api/tr/buscar?dep=${encodeURIComponent(TR.dep)}&q=${encodeURIComponent(TR.q)}`)).json();
    TR.res = r.stats || [];
    if (!TR.res.length) TR.msg = 'No encontré esa estadística. Prueba con otras palabras (ej. "yardas por tierra que permite").';
    TR.cargando = ''; render();
    if (TR.res.length) await leerTR(TR.res[0].slug);
  } catch { TR.cargando = ''; TR.msg = 'No se pudo consultar TeamRankings.'; render(); }
}
async function leerTR(slug){
  TR.cargando = 'Trayendo la tabla de TeamRankings… (pide 10 s entre consultas)'; render();
  try {
    const r = await fetch(`/api/tr/stat?dep=${encodeURIComponent(TR.dep)}&slug=${encodeURIComponent(slug)}`);
    const d = await r.json();
    if (d.error) TR.msg = d.error; else TR.tabla = d;
  } catch { TR.msg = 'No se pudo leer la tabla.'; }
  TR.cargando = ''; render();
}

    const p = P[id], j = J[p.juego];
    slip.push({id, texto: textoPata(p), juego: p.juego, jn: `${DEP[p.deporte]} · ${nomJuego(j)}`,
               cuando: cuando(j, true), orden: j.fecha, est: estDe(p), momio: momioSug(p), aprox: p.momio == null,
               regla: p.regla, liga: j.liga, sport: j.sport, base: j.base, tipo: j.tipo, fecha: j.fecha, partido: nomJuego(j), pa: !!p.pa});
    ultimoAgregado = id;
    slip.sort((x, y) => (x.orden || '').localeCompare(y.orden || ''));
  }
  guardar(); if (!sinRender) render();
}
// completa tu parlay con las patas que más pagan por el riesgo hasta llegar a lo que quieres cobrar
function completar(){
  const meta = parseFloat(String(metaCompletar).replace(/[^\d.]/g, ''));
  if (!meta || !apuesta) { msgCompletar = 'Pon cuánto quieres cobrar.'; render(); return; }
  let d = slip.reduce((a, l) => a * dec(l.momio), 1);
  const objetivo = meta / apuesta;
  if (d >= objetivo) { msgCompletar = `Ya llegas: con ${pesos(apuesta)} cobras ${pesos(apuesta * d)}.`; render(); return; }
  const juegos = new Set(slip.map(l => l.juego)), cuenta = {};
  const pool = poolParlays().filter(p => !juegos.has(p.juego));
  let n = 0;
  while (d < objetivo && n < 15){
    let mejor = null, mv = -Infinity;
    for (const p of pool){
      if (juegos.has(p.juego) || estDe(p) < .55) continue;
      const v = rDe(p) - .15 * (cuenta[p.deporte] || 0);
      if (v > mv){ mv = v; mejor = p; }
    }
    if (!mejor) break;
    agregar(mejor.id, false, true); juegos.add(mejor.juego); cuenta[mejor.deporte] = (cuenta[mejor.deporte] || 0) + 1;
    d *= dec(momioSug(mejor)); n++;
  }
  msgCompletar = d >= objetivo ? `Listo: le agregué ${n} pata${n === 1 ? '' : 's'}. Con ${pesos(apuesta)} cobras ${pesos(apuesta * d)}.` : `Solo llegué a ${pesos(apuesta * d)} con las patas que pasan tus filtros.`;
  render();
}

function cargarImg(url){
  return new Promise(res => {
    if (!url) return res(null);
    const im = new Image(); im.crossOrigin = 'anonymous';
    const t = setTimeout(() => res(null), 5000);
    im.onload = () => { clearTimeout(t); res(im); }; im.onerror = () => { clearTimeout(t); res(null); };
    im.src = url;
  });
}
function rrect(g, x, y, w, h, r){ g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function lineas(g, texto, ancho, max){
  const palabras = String(texto).split(' '), out = [];
  let linea = '';
  for (const w of palabras){
    const prueba = linea ? linea + ' ' + w : w;
    if (g.measureText(prueba).width > ancho && linea){ out.push(linea); linea = w; } else linea = prueba;
  }
  if (linea) out.push(linea);
  if (out.length > max){ out.length = max; let u = out[max - 1]; while (g.measureText(u + '…').width > ancho && u.length) u = u.slice(0, -1); out[max - 1] = u + '…'; }
  return out;
}
async function imagenParlay(){
  try { await document.fonts.ready; } catch {}
  const F = 'Geist, "Segoe UI", system-ui, sans-serif', FN = '"Barlow Condensed", Geist, sans-serif';
  const W = 1080, PAD = 56, ROW = 172, HEAD = 330, FOOT = 470;

  brillo.addColorStop(0, 'rgba(255,201,77,.22)'); brillo.addColorStop(1, 'rgba(255,201,77,0)');
  g.fillStyle = brillo; g.fillRect(0, 0, W, 900);

    const a = esFut(j) ? j.L : j.V, b = esFut(j) ? j.V : j.L;
    if (foto(a.logo)) return [cdn(a.logo, 264, 192)];
    return [cdn((a.logo || '').replace('/500/', '/500-dark/'), 120, 120), cdn((b.logo || '').replace('/500/', '/500-dark/'), 120, 120)];
  };
  const imgs = await Promise.all(legs.map(async x => Promise.all(urlDe(x).map(cargarImg))));
  // encabezado
  const d = slip.reduce((a, l) => a * dec(l.momio), 1);
  const prob = slip.reduce((a, l) => a * (P[l.id] ? estDe(P[l.id]) : l.est), 1);
  g.fillStyle = '#ffc94d'; g.font = `700 30px ${F}`; g.fillText('MI PARLAY', PAD, 96);
  g.fillStyle = '#e9ecf3'; g.font = `700 96px ${FN}`; g.fillText(`${legs.length} pata${legs.length > 1 ? 's' : ''} · ${fmtM(amer(d))}`, PAD, 190);
  const ju = legs.length ? J[legs[legs.length - 1].l.juego] : null;
  g.fillStyle = '#8a93a8'; g.font = `500 30px ${F}`;
  g.fillText(`${DIAS_JS[AHORA.getDay()]} ${AHORA.getDate()} ${MESES_JS[AHORA.getMonth()]}${ju ? ' · se define ' + cuando(ju, true) : ''}`, PAD, 248);
  // patas
  legs.forEach(({l, p, j}, i) => {
    const y = HEAD - 30 + i * ROW, x = PAD, w = W - PAD * 2, h = ROW - 16;
    g.fillStyle = '#131720'; rrect(g, x, y, w, h, 28); g.fill();
    // avatar
    const cx = x + 26 + 46, cy = y + h / 2, rA = 46;
    g.save(); g.beginPath(); g.arc(cx, cy, rA, 0, Math.PI * 2); g.fillStyle = '#222838'; g.fill(); g.clip();
    const [a, b] = imgs[i];
    const esFoto = im => im && im.width !== im.height;  // fotos de jugadores/peleadores (no cuadradas)
    if (a && esFoto(a)){ const s = rA * 2 / a.height; g.drawImage(a, cx - a.width * s / 2, cy - rA, a.width * s, rA * 2); }
    else if (p && p.clase === 'jugador' && b){ g.drawImage(b, cx - rA * .7, cy - rA * .7, rA * 1.4, rA * 1.4); }
    else if (a && b){ g.drawImage(a, cx - rA * .86, cy - rA * .86, rA, rA); g.drawImage(b, cx - rA * .14, cy - rA * .14, rA, rA); }
    else if (a){ g.drawImage(a, cx - rA * .7, cy - rA * .7, rA * 1.4, rA * 1.4); }
    g.restore();
    // textos
    const tx = cx + rA + 26, anchoTxt = w - (tx - x) - 220;
    g.font = `600 34px ${F}`; g.fillStyle = '#e9ecf3';
    const ls = lineas(g, l.texto, anchoTxt, 2);
    const baseY = cy - (ls.length === 2 ? 30 : 12);
    ls.forEach((t, k) => g.fillText(t, tx, baseY + k * 40));
    g.font = `500 25px ${F}`; g.fillStyle = '#8a93a8';
    const meta = `${j ? DEP[j.tipo] + ' · ' + nomJuego(j) + ' · ' + cuando(j) : l.jn}`;
    g.fillText(lineas(g, meta, anchoTxt, 1)[0], tx, baseY + ls.length * 40 + 8);
    // momio y probabilidad
    g.textAlign = 'right';
    g.font = `700 54px ${FN}`; g.fillStyle = l.aprox ? '#b8c0d2' : '#e9ecf3';
    g.fillText(fmtM(l.momio) + (l.aprox ? ' ≈' : ''), x + w - 28, cy + 6);
    g.font = `600 25px ${F}`; g.fillStyle = '#2fd27a';
    g.fillText(pct(p ? estDe(p) : l.est), x + w - 28, cy + 44);
    g.textAlign = 'left';
  });
  // resumen
  const fy = HEAD - 30 + legs.length * ROW + 14, fw = W - PAD * 2;
  const borde = g.createLinearGradient(PAD, fy, PAD + fw, fy + 300);
  borde.addColorStop(0, 'rgba(255,201,77,.55)'); borde.addColorStop(1, 'rgba(255,201,77,.12)');

  g.lineWidth = 3; g.strokeStyle = borde; rrect(g, PAD, fy, fw, 300, 34); g.stroke();
  const col = (cx, et, val, color, tam) => { g.fillStyle = '#8a93a8'; g.font = `600 27px ${F}`; g.fillText(et, cx, fy + 78); g.fillStyle = color; g.font = `700 ${tam}px ${FN}`; g.fillText(val, cx, fy + 78 + tam + 6); };
  col(PAD + 40, 'Momio total', fmtM(amer(d)), '#e9ecf3', 76);
  col(PAD + 40 + fw / 3, 'Apuesta', pesos(apuesta), '#e9ecf3', 76);
  col(PAD + 40 + fw * 2 / 3, 'Cobras', pesos(apuesta * d), '#ffc94d', 76);
  g.fillStyle = '#b8c0d2'; g.font = `500 28px ${F}`;
  g.fillText(`Prob. estimada ${pct(prob)} (1 de cada ${Math.round(1 / prob).toLocaleString('es-MX')})${PUBLICO ? '' : ' · ' + CASA_SEL}`, PAD + 40, fy + 250);
  g.fillStyle = '#5f6880'; g.font = `500 24px ${F}`;
  g.fillText('Momios con ≈ son aproximados · stats ESPN · no es garantía', PAD, H - 56);
  return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('imagen')), 'image/png'));
}
