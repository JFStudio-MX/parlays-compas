  const TABS = [['partidos', 'Partidos', vv.filter(j => (st.dep === 'todos' || j.tipo === st.dep) && (st.dia === 'todos' || j.dia === st.dia)).length],
    ['candados', 'Candados', cnt('candados')], ['joyitas', 'Joyitas', cnt('joyitas')], ['parlays', 'Parlays', PLS.length],
    ['apuestas', 'Mis apuestas', pend ? pend + ' en juego' : APS.length], ['historial', 'Historial', D.historial && D.historial.total ? D.historial.total.n : 0]]
    .filter(([k]) => !PUBLICO || !['stats', 'apuestas'].includes(k));
  $('#tabs').innerHTML = TABS.map(([k, t, n]) => `<button class="tab ${st.tab === k ? 'on' : ''}" data-tab="${k}">${ic(k)}${t}<span class="n">${n}</span></button>`).join('');
  // cel: barra de abajo con 4 secciones + "Más" (o Historial en la versión de los compas)
  const extra = TABS.slice(4);
  const enExtra = extra.some(([k]) => k === st.tab);
  $('#nav').innerHTML = TABS.slice(0, 4).map(([k, t, n]) => `<button class="${st.tab === k ? 'on' : ''}" data-tab="${k}">${ic(k)}${t}${(k === 'candados' || k === 'joyitas') && n ? `<span class="bd">${n}</span>` : ''}</button>`).join('')
    + (extra.length === 1 ? `<button class="${st.tab === extra[0][0] ? 'on' : ''}" data-tab="${extra[0][0]}">${ic(extra[0][0])}${extra[0][1]}</button>`
                          : `<button class="${enExtra || st.mas ? 'on' : ''}" data-mas="1">${ic('mas')}Más</button>`);
  $('#mas').classList.toggle('on', st.mas);
  $('#mas').innerHTML = extra.map(([k, t, n]) => `<button class="${st.tab === k ? 'on' : ''}" data-tab="${k}">${ic(k)}${t}${n !== '' ? `<span class="n" style="margin-left:auto;color:var(--mu)">${n}</span>` : ''}</button>`).join('');
  const nf = nFiltros();
  $('#filbtn').innerHTML = `${ic('filtro')} Filtrar${nf ? ' (' + nf + ')' : ''}`;
  $('#filbtn').classList.toggle('on', st.filtro || !!nf);
  $('#filbtn2').innerHTML = `${ic('filtro')}${nf ? nf : ''}`;
  $('#filbtn2').classList.toggle('on', st.filtro || !!nf);
  const abiertos = [...document.querySelectorAll('.juego.open')].map(e => e.id);
  const foco = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.f;
  // las tarjetas entran animadas solo cuando cambias de sección, deporte, día o partido (no en cada clic)
  const clave = [st.tab, st.dep, st.dia, st.juego].join('|');
  $('#main').classList.toggle('entra', clave !== vistaPrevia);
  vistaPrevia = clave;
  localStorage.setItem('parlay_tab', JSON.stringify(st.tab));
  vista();
  abiertos.forEach(id => document.getElementById(id)?.classList.add('open'));
  if (foco){ const el = document.querySelector(`[data-f="${foco}"]`); if (el){ el.focus(); el.setSelectionRange?.(el.value.length, el.value.length); } }
  $('#slip').innerHTML = slipHTML();
  const d = slip.reduce((a, l) => a * dec(l.momio), 1);
  $('#fab').innerHTML = slip.length
    ? `<span class="fn">${slip.length}</span><span>Mi parlay</span><span class="fm2">${fmtM(amer(d))}<small>cobras ${pesos(apuesta * d)}</small></span>`
    : `<span class="fn">+</span><span>Mi parlay</span><span class="fm2"><small>arma uno o pon cuánto quieres cobrar</small></span>`;
  if (ultimoAgregado){  // "pop" en el botón que agregaste y brinco del contador
    document.querySelectorAll(`[data-add="${ultimoAgregado}"]`).forEach(b => b.classList.add('pop'));
    const f = $('#fab'); f.classList.remove('bump'); void f.offsetWidth; f.classList.add('bump');
    ultimoAgregado = null;
  }
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-add],[data-combo],[data-dep],[data-dia],[data-tab],[data-toggle],[data-quitar],[data-cargar],[data-res],[data-borrar],[data-cubrir],[data-excluir],[data-restablecer],[data-fset],[data-fmulti],[data-flimpiar],[data-ejemplo],[data-trslug],[data-monto],#copiar,#vaciar,#fab,#hoy,#lometi,#r-ok,#r-no,#filbtn,#completar,#act,#ia-ir,#ia-borrar,#tr-ir,#imagen,#velo,[data-juego],[data-volver],[data-mas],#filbtn2,#casabtn,[data-casa]');
  if (!t) return;
  if (t.dataset.juego) { st.tab = 'partidos'; st.juego = t.dataset.juego; st.mas = false; render(); scrollTo(0, 0); return; }
  if (t.dataset.volver) { st.juego = null; render(); return; }
  if (t.dataset.mas) { st.mas = !st.mas; render(); return; }
  if (t.id === 'casabtn') { st.casa = !st.casa; render(); return; }
  if (t.dataset.casa) {
    CASA_SEL = t.dataset.casa; st.casa = false; localStorage.setItem('parlay_casa', JSON.stringify(CASA_SEL));
    slip.forEach(l => { if (P[l.id] && P[l.id].momio == null) l.momio = momioSug(P[l.id]); }); guardar(); render(); return;
  }
  if (t.id === 'filbtn2') { st.filtro = !st.filtro; if (st.filtro) scrollTo(0, 0); render(); return; }
  if (t.id === 'imagen') { compartirImagen(t); return; }
  if (t.id === 'velo') { hoja(false); return; }
  if (t.dataset.monto) { apuesta = +t.dataset.monto; guardar(); render(); return; }
  if (t.id === 'hoy') { fechar(); st.dia = 'Hoy'; st.tab = 'parlays'; render(); scrollTo(0, 0); }
  else if (t.id === 'filbtn') { st.filtro = !st.filtro; render(); }
  else if (t.dataset.fset) { const [k, v] = t.dataset.fset.split('|'); FILT[k] = k === 'minProb' ? +v : v; guardarFiltros(); render(); }
  else if (t.dataset.fmulti) { const [k, v] = t.dataset.fmulti.split('|'); FILT[k] = FILT[k].includes(v) ? FILT[k].filter(x => x !== v) : [...FILT[k], v]; guardarFiltros(); render(); }
  else if (t.dataset.flimpiar) { FILT = {...FILT0}; guardarFiltros(); render(); }
  else if (t.dataset.excluir) { EXCL.add(t.dataset.excluir); guardarExcl(); render(); }
  else if (t.dataset.restablecer) { EXCL.clear(); guardarExcl(); render(); }
  else if (t.dataset.add) agregar(t.dataset.add);
  else if (t.dataset.combo) { const c = D.combos.find(x => x.id === t.dataset.combo); agregar(c.a, false, true); agregar(c.b, false); }
  else if (t.dataset.dep) { st.dep = t.dataset.dep; render(); }
  else if (t.dataset.dia) { st.dia = t.dataset.dia; render(); }
  else if (t.dataset.tab) { st.tab = t.dataset.tab; st.juego = null; st.mas = false; render(); scrollTo(0, 0); }
  else if (t.dataset.toggle) document.getElementById('j' + t.dataset.toggle).classList.toggle('open');
  else if (t.dataset.quitar) { slip.splice(+t.dataset.quitar, 1); guardar(); render(); }
  else if (t.dataset.cargar) {
    slip = [];
    const pl = PLS[+t.dataset.cargar];
    if (pl.monto) apuesta = pl.monto;
    pl.legs.forEach(id => agregar(id, false, true));
    render();
    if (innerWidth <= 980) hoja(true);
  }
  else if (t.id === 'completar') { metaCompletar = ($('#meta') || {}).value || metaCompletar; completar(); }
  else if (t.id === 'vaciar') { slip = []; registrando = false; msgCompletar = ''; guardar(); render(); }
  else if (t.id === 'fab') hoja(!$('#slip').classList.contains('abierta'));
  else if (t.id === 'lometi') { registrando = true; render(); }
  else if (t.id === 'r-no') { registrando = false; render(); }
  else if (t.id === 'r-ok') {
    const monto = parseFloat(String($('#r-monto').value).replace(/[^\d.]/g, '')) || 0;
    const momio = parseInt(String($('#r-momio').value).replace(/[^\d-]/g, ''), 10);
    if (!monto || Math.abs(momio) < 100) { alertaSlip('Revisa el monto y el momio.'); return; }
    const casa = $('#r-casa').value;
    const body = {creada: new Date().toISOString(), casa, monto, momio,
      legs: slip.map(l => ({texto: l.texto, juego: l.juego, liga: l.liga, sport: l.sport, base: l.base, tipo: l.tipo,
                            fecha: l.fecha, partido: l.partido, regla: l.regla, momio: l.momio, pa: l.pa}))};
    try { await api('/api/apuestas', body); registrando = false; st.tab = 'apuestas'; render(); scrollTo(0, 0); }
    catch { alertaSlip('No se pudo guardar: ¿está abierta la ventanita de Parlays?'); }
  }
  else if (t.dataset.res) {
    const [id, res] = t.dataset.res.split('|');
    let campos = {resultado: res || null, cobrado: null};
    if (res === 'cashout'){
      const v = prompt('¿Cuánto cobraste con el cash out?');
      if (v == null) return;
      campos.cobrado = parseFloat(String(v).replace(/[^\d.]/g, '')) || 0;
    }
    try { await api('/api/apuestas/actualizar', {id, campos}); render(); } catch {}
  }
  else if (t.dataset.borrar) {
    if (!confirm('¿Borrar esta apuesta de tu registro?')) return;
    try { await api('/api/apuestas/borrar', {id: t.dataset.borrar}); render(); } catch {}
  }
  else if (t.dataset.cubrir) { const id = t.dataset.cubrir; if (cubrir[id]) delete cubrir[id]; else cubrir[id] = {momio: ''}; render(); }
  else if (t.id === 'copiar') {
    const d = slip.reduce((a, l) => a * dec(l.momio), 1);
    const txt = slip.map((l, i) => `${i + 1}. ${l.texto} (${fmtM(l.momio)}) — ${l.cuando ? l.cuando + ' · ' : ''}${l.jn}`).join('\n') + `\nMomio total ${fmtM(amer(d))} · ${pesos(apuesta)} → ${pesos(apuesta * d)}`;
    navigator.clipboard.writeText(txt).then(() => { t.textContent = '¡Copiado!'; setTimeout(() => t.textContent = 'Copiar', 1500); });
  }
  else if (t.id === 'act') {
    t.disabled = true; t.textContent = '⏳ Actualizando… (30 s a unos minutos)';
    try {
      const r = await (await fetch('/api/actualizar', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'})).json();
      if (r.ok) location.reload();
      else { t.disabled = false; t.innerHTML = '🔄 <span class="tl">Actualizar</span>'; alertaGeneral(r.error || 'No se pudo actualizar.'); }
    } catch { t.disabled = false; t.innerHTML = '🔄 <span class="tl">Actualizar</span>'; alertaGeneral('No se pudo actualizar: ¿está abierta la ventanita de Parlays?'); }
  }
  else if (t.id === 'ia-ir') preguntarIA();
  else if (t.id === 'ia-borrar') { IA.conv = []; render(); }
  else if (t.dataset.ejemplo) { IA.q = t.dataset.ejemplo; render(); $('#ia-q')?.focus(); }
  else if (t.id === 'tr-ir') buscarTR();
  else if (t.dataset.trslug) leerTR(t.dataset.trslug);
});
function alertaSlip(msg){ const f = document.querySelector('.form'); if (f){ let a = f.querySelector('.aviso'); if (!a){ a = document.createElement('div'); a.className = 'aviso no'; f.appendChild(a); } a.textContent = msg; } }
function alertaGeneral(msg){ const m = $('#main'); const a = document.createElement('div'); a.className = 'aviso no'; a.style.marginBottom = '12px'; a.textContent = msg; m.prepend(a); }
let tFiltro = null;
document.addEventListener('input', e => {
  if (e.target.dataset.f === 'q'){ FILT.q = e.target.value; guardarFiltros(); clearTimeout(tFiltro); tFiltro = setTimeout(render, 250); }
  else if (e.target.id === 'ia-q') IA.q = e.target.value;
  else if (e.target.id === 'meta') metaCompletar = e.target.value;
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'ia-q' && e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); preguntarIA(); }
  if (e.target.id === 'tr-q' && e.key === 'Enter'){ e.preventDefault(); buscarTR(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.mi) {
    const v = parseInt(String(t.value).replace(/[^\d-]/g, ''), 10);
    const l = slip[+t.dataset.mi];
    if (Math.abs(v) >= 100) { l.momio = v; l.aprox = false; }
    guardar(); render();
  } else if (t.id === 'apuesta') {
    apuesta = Math.max(1, parseFloat(String(t.value).replace(/[^\d.]/g, '')) || 50); guardar(); render();
  } else if (t.dataset.f === 'momMin' || t.dataset.f === 'momMax') {
    FILT[t.dataset.f] = t.value === '' ? '' : String(parseInt(t.value, 10) || ''); guardarFiltros(); render();
  } else if (t.dataset.fchk) {
    FILT[t.dataset.fchk] = t.checked; guardarFiltros(); render();
  } else if (t.dataset.cobm) {
    cubrir[t.dataset.cobm] = {momio: parseInt(String(t.value).replace(/[^\d-]/g, ''), 10) || ''}; render();
  } else if (t.dataset.libre) {
    LIBRE[t.dataset.libre] = String(t.value).replace(/[^\d.-]/g, ''); render();
  } else if (t.id === 'tr-semana') { TR.soloSemana = t.checked; render(); }
  else if (t.id === 'tr-dep') { TR.dep = t.value; TR.res = []; TR.tabla = null; render(); }
});
document.addEventListener('click', e => {
  if (innerWidth <= 980 && $('#slip').classList.contains('abierta') && !e.target.closest('#slip,#fab,[data-add],[data-cargar],[data-combo],.visor')) hoja(false);
  // composedPath: el botón que tocaste ya pudo ser reemplazado por render(), así que se revisa la ruta original del clic
  const dentro = sel => e.composedPath().some(n => n.matches && n.matches(sel));
  if (st.mas && !dentro('#nav,#mas')) { st.mas = false; $('#mas').classList.remove('on'); }
  if (st.casa && !dentro('.casawrap')) { st.casa = false; render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && st.casa) { st.casa = false; render(); $('#casabtn').focus(); } });
// cel: el encabezado se esconde al bajar y regresa en cuanto subes tantito
let ultY = scrollY;
addEventListener('scroll', () => {
  const y = scrollY, dy = y - ultY;
  if (Math.abs(dy) < 8) return;
  document.querySelector('header').classList.toggle('oculto', innerWidth <= 980 && dy > 0 && y > 160 && !st.casa);
  ultY = y;
}, {passive: true});
render();
// cada minuto revisa la hora: si empezó un partido, lo quita y rearma los parlays
setInterval(() => {
  if (document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;  // no interrumpir si estás escribiendo
  const antes = vivos().map(j => j.id).join() + '|' + D.juegos.map(j => j.dia).join();
  fechar();
  const ahora = vivos().map(j => j.id).join() + '|' + D.juegos.map(j => j.dia).join();
  if (antes !== ahora) render();
  else $('#fecha').textContent = `Son las ${horaAhora()} · ${vivos().length} partidos por jugar · datos de ${D.titulo}`;
}, 60000);
</script>
