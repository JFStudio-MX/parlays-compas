# Actualiza la versión para los compas cada 15 minutos, de 8 am a medianoche (hora del centro de México, UTC-6).
# Corre el programa en GitHub, cifra la página con la clave del grupo (secret CLAVE_PARLAYS)
# y sube publico/index.html; Vercel la publica sola.
name: Actualizar parlays

on:
  schedule:
    # Minutos 7/22/37/52 (no en punto: GitHub atrasa o se salta las corridas a la hora exacta)
    - cron: "7,22,37,52 14-23 * * *"   # 8:07 am a 5:52 pm en México
    - cron: "7,22,37,52 0-5 * * *"     # 6:07 pm a 11:52 pm en México
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-parlays
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paquete para cifrar
        run: pip install cryptography

      - name: Traer historial y partidos guardados
        uses: actions/cache/restore@v4
        with:
          path: |
            cache/partidos
            cache/tr
            datos
          key: parlays-${{ github.run_id }}
          restore-keys: parlays-

      - name: Bajar partidos y armar la página
        env:
          CLAVE_PARLAYS: ${{ secrets.CLAVE_PARLAYS }}
        run: python -X utf8 parlays.py --no-abrir --publico

      - name: Guardar historial y partidos
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            cache/partidos
            cache/tr
            datos
          key: parlays-${{ github.run_id }}

      - name: Publicar
        run: |
          git config user.name "parlays-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publico/index.html
          git commit -m "Datos $(TZ=America/Mexico_City date '+%d/%m %H:%M')" || exit 0
          git pull --rebase -X theirs
          git push
