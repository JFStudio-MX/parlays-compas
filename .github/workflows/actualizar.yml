# Actualiza la versión para los compas cada 15 minutos, de 8 am a medianoche (hora del centro de México, UTC-6).
# Corre el programa en GitHub, cifra la página con la clave del grupo (secret CLAVE_PARLAYS)
# y sube publico/ a la rama "sitio" (una sola copia); Vercel publica esa rama.
name: Actualizar parlays

on:
  # El horario lo pone cron-job.org (cada 15 min, 8:07 am a 11:52 pm, America/Mexico_City):
  # hace POST a la API de GitHub para lanzar este workflow. El "schedule" de GitHub no era confiable.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-parlays
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paquete para cifrar
        run: pip install cryptography

      - name: Traer historial y partidos guardados
        uses: actions/cache/restore@v4
        with:
          path: |
            cache/partidos
            cache/tr
            datos
          key: parlays-${{ github.run_id }}
          restore-keys: parlays-

      - name: Bajar partidos y armar la página
        env:
          CLAVE_PARLAYS: ${{ secrets.CLAVE_PARLAYS }}
        run: python -X utf8 parlays.py --no-abrir --publico

      - name: Guardar historial y partidos
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            cache/partidos
            cache/tr
            datos
          key: parlays-${{ github.run_id }}

      # La página (1.6 MB cifrada) va a la rama "sitio" con UNA sola copia que se reemplaza cada vez
      # (push --force), para que el repo no crezca ~100 MB al día. Vercel publica la rama "sitio".
      - name: Publicar en la rama sitio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SITIO=$(mktemp -d)
          cp -r publico vercel.json "$SITIO"/
          cd "$SITIO"
          git init -q -b sitio
          git config user.name "parlays-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Datos $(TZ=America/Mexico_City date '+%d/%m %H:%M')"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" sitio
